name: Porymap Studio CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux-build:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtcharts'
          cache: true

      - name: Configure
        run: qmake -config release porymap.pro

      - name: Compile
        run: make -j2

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt and matching MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtcharts'
          cache: true
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          add-tools-to-path: true

      - name: Configure
        shell: pwsh
        run: qmake -config release porymap.pro

      - name: Verify compiler toolchain
        shell: pwsh
        run: |
          g++ --version
          mingw32-make --version

      - name: Compile
        shell: pwsh
        run: mingw32-make -j2

      - name: Smoke test executable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath "$PWD\release\porymap.exe" -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            throw "Porymap Studio exited during the startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: porymap-studio-windows-${{ github.sha }}
          path: release/porymap.exe
          if-no-files-found: error