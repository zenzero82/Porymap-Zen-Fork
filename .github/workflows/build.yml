name: Porymap Studio CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux-build:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtcharts'
          cache: true

      - name: Configure
        run: qmake -config release porymap.pro

      - name: Compile
        run: make -j2

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtcharts'
          cache: true

      - name: Configure
        shell: pwsh
        run: qmake -config release porymap.pro

      - name: Compile
        shell: pwsh
        run: |
          mingw32-make -j2 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content -Path windows-build.log -Tail 80 | ForEach-Object {
              $message = $_.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Output "::error title=Windows MinGW build output::$message"
            }
            exit $LASTEXITCODE
          }

      - name: Upload Windows build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: porymap-studio-windows-build-log-${{ github.sha }}
          path: windows-build.log
          if-no-files-found: warn

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: porymap-studio-windows-${{ github.sha }}
          path: release/porymap.exe
          if-no-files-found: error